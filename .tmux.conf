# tmux 3.2a+

# Key Binding --------------------{{{
# 前缀
unbind C-b
set -g prefix C-a
bind C-a send-prefix 
bind r source-file ~/.tmux.conf \;  display-message "Config Reloaded!"
unbind %
bind | split-window -h -c "#{pane_current_path}"      # 使用|竖屏，方便分屏 使用当前路径
unbind '"'
bind - split-window -v -c "#{pane_current_path}"      # 使用-横屏，方便分屏
# use vim mode to move panel
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind K clear-history
bind l select-pane -R
bind v switch-client -l
bind-key * list-clients

## Join windows: <prefix> s, <prefix> j
bind-key g command-prompt -p "send pane to:"  "join-pane -t '%%'"
# move this pane to a new widnow 独占当前 widnow
bind-key G break-pane -b

# Move window to left
bind \{ swap-window -t -1\; select-window -t -1
bind \} swap-window -t +1\; select-window -t +1

# Killer
bind x kill-pane
bind X kill-window

# open customeize mode
bind -N 'Customize options' U customize-mode -Z

# working directory
# set default directory for new windows in this session to current directory:
bind b attach-session -c "#{pane_current_path}"
# open a new window in the current directory
bind C new-window -c "#{pane_current_path}"

unbind y
bind y switch-client -l


set -g set-titles on
set -g set-titles-string "[#S] #I:#W"

# }}}

# General settings --------------------{{{ 
setw -g mode-keys vi
set -g default-terminal "tmux-256color"   # use 256 colors
# true color (24-bit) support
set -ga terminal-overrides ",xterm-256color:Tc"
set -g display-time 4001                  # status line messages display
set -g history-limit 100000                 # scrollback buffer n lines
set -g base-index 1
setw -g pane-base-index 1
# focus events enabled for terminals that support them
set -g focus-events on
# super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on
# for vim's delaying escape:
# https://github.com/neovim/neovim/wiki/FAQ#esc-in-tmux-or-gnu-screen-is-delayed
set -sg escape-time 10

set -g mouse on



# }}}

# Status bar --------------------{{{ 
set -g status-bg black
set -g status-fg white
set-option -g status-justify left
set-option -g status-left '#[fg=cyan][#{session_name}]'
set-option -g status-right '#[fg=#9e5d3c]#(tmux-status-right.sh)'

set-option -g pane-border-lines double
set-option -g pane-border-indicators arrows
set-option -g pane-border-status top
# 非 active pane：灰色边框
set-option -g pane-border-style 'fg=colour240'
# active pane：蓝色边框
set-option -g pane-active-border-style 'fg=colour39'

# 标题格式：[.序号] ║ 标题 ║ 目录名 ║ 当前命令
# - 整条 border 顶部都填满背景色（active colour24 深蓝 / 非 active colour238 深灰），
#   中间不再用 #[default] 断开背景，这样 ║ 分隔符和文字都在同一块底色上，不会显得突兀
# - 序号徽章用亮白+粗体标出 active/非 active；标题/目录/命令各自固定一种前景色区分信息类型
# - 目录只显示 basename（#{b:...}），避免长路径把整条 border 占满
set-option -g pane-border-format '#{?pane_active,#[bg=colour24 fg=colour255 bold],#[bg=colour238 fg=colour250]} .#{pane_index} #[fg=colour245 nobold] #[fg=colour117]#{pane_title} #[fg=colour245][#[fg=colour150]#{b:pane_current_path}#[fg=colour245]] #[fg=colour215]./#{pane_current_command} #[default]'



# window
setw -g automatic-rename off
set-option -g allow-rename off
set-window-option -g window-style default
set-window-option -g clock-mode-colour black
set-window-option -g clock-mode-style 24
# 非 active window：用比 status bar 稍亮的深灰背景，避免与 active window 混淆
set-window-option -g window-status-style fg='#bcbcbc',bg='#303030'
# active window：保留原来的橙色背景
set-window-option -g window-status-current-style fg='#333333',bg="#ff9966"
set-window-option -g monitor-activity on

# disable sound bell
set -g bell-action none
set -g visual-bell on

bind-key c new-window -n 'shell'

# }}}

# panel --------------------{{{ 
set-option -g display-panes-active-colour blue
set-option -g display-panes-colour brightred
# }}}

# copy-mode selection style
setw -g mode-style 'fg=#333333 bg=#ff9966 bold'

# message style
set-option -g message-style bg=colour232
set-option -g message-style fg=colour5

# to support underline in kitty
# https://evantravers.com/articles/2021/02/05/curly-underlines-in-kitty-tmux-neovim/
# undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
# underscore colors - needs tmux-3.0
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# copy last command output
bind -n S-Left {
  copy-mode
  send -X clear-selection
  send -X start-of-line
  send -X start-of-line
  send -X cursor-up
  send -X start-of-line
  send -X start-of-line

  if -F "#{m:*➜ *,#{copy_cursor_line}}" {
    send -X search-forward-text "➜ "
    send -X stop-selection
    send -X -N 2 cursor-right
    send -X begin-selection
    send -X end-of-line
    send -X end-of-line
    if "#{m:*➜ ?*,#{copy_cursor_line}}" {
      send -X cursor-left
    }
  } {
    send -X end-of-line
    send -X end-of-line
    send -X begin-selection
    send -X search-backward-text "➜ "
    send -X end-of-line
    send -X end-of-line
    send -X cursor-right
    send -X stop-selection
  }
}

bind -n S-Up {
  copy-mode
  send -X clear-selection
  send -X start-of-line
  send -X start-of-line
  send -X cursor-left
  send -X begin-selection
  send -X search-backward "(\\$ )|(# )"
  send -X start-of-line
  send -X start-of-line
  send -X stop-selection
}

bind -n S-Down {
  copy-mode
  send -X clear-selection
  send -X end-of-line
  send -X end-of-line
  send -X search-forward "(\\$ )|(# )"
  send -X start-of-line
  send -X start-of-line
  send -X begin-selection
  send -X search-forward "(\\$ )|(# )"
  send -X search-forward "(\\$ )|(# )"
  send -X start-of-line
  send -X start-of-line
  send -X cursor-left
  send -X stop-selection
}

set -s copy-command 'pbcopy'

bind u 'display-message "close window to right!"; run-shell "/Users/xintao.lai/bin/tkw_tmux-kill-window-to-right.sh"'

unbind H
unbind J
unbind K
unbind L
bind H move-pane -t '.{left-of}'
bind L move-pane -t '.{right-of}'
bind J move-pane -h -t '.{down-of}'
bind K move-pane -h -t '.{up-of}'


# Quick select windows
# https://superuser.com/questions/755634/how-to-quickly-switch-to-n-10-windows-in-tmux
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Send the same command to all panes/windows in current session
unbind E
bind E command-prompt -p "Command(all panes in session):" \
    "run \"tmux list-panes -s -F '##{session_name}:##{window_index}.##{pane_index}' \
                | xargs -I PANE tmux send-keys -t PANE '%1' Enter\""

# Send the same command to all panes in the current window
unbind e
bind e command-prompt -p "Command(all panes in window):" \
    "run \"tmux list-panes -F '##{window_index}.##{pane_index}' \
           | xargs -I PANE tmux send-keys -t PANE '%1' Enter\""

# same session, last used window
bind -r \\ select-window -l

# Copy selected text without exiting copy-mode
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection

unbind o
# List of plugins
set-option -g @fzf-links-python "/Users/xintao.lai/.pyenv/versions/3.12.9/bin/python3"
set-option -g @fzf-links-key o
set -g @plugin 'alberti42/tmux-fzf-links'
set -g @plugin 'tmux-plugins/tpm'

set -g @agent-sidebar-key "a"
set -g @agent-park-key "M"
set -g @plugin 'samleeney/tmux-agent-status'

run '~/.tmux/plugins/tpm/tpm'
